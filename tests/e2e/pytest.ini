# E2E 测试配置
# 运行 E2E 测试前需要:
# 1. 安装 playwright: pip install playwright
# 2. 安装浏览器: playwright install chromium
# 3. 启动 Dashboard: streamlit run app.py

[pytest]
# E2E 测试标记
markers =
    e2e: End-to-end tests using Playwright
    slow: Slow running tests

# 超时设置
timeout = 120

# 默认命令行选项 (取消 -m e2e 过滤)
addopts = -v --tb=short
